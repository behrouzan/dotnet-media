name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore DotnetMedia.slnx
      - run: dotnet build DotnetMedia.slnx --configuration Release --no-restore
      - run: dotnet test DotnetMedia.slnx --configuration Release --no-build --no-restore
      - run: dotnet pack src/DotnetMedia.Core/DotnetMedia.Core.csproj --configuration Release --no-build --no-restore --output ${{ runner.temp }}/dotnet-media-pack
      - run: dotnet pack src/DotnetMedia.Storage.Local/DotnetMedia.Storage.Local.csproj --configuration Release --no-build --no-restore --output ${{ runner.temp }}/dotnet-media-pack
      - run: dotnet pack src/DotnetMedia.Imaging/DotnetMedia.Imaging.csproj --configuration Release --no-build --no-restore --output ${{ runner.temp }}/dotnet-media-pack
